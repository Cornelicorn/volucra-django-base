[project]
name = "volucra-django-base"
version = "0.1.0"
description = "Reusable Django apps: tabler_ui for the Tabler based look and the account pages, volucra_base for user preferences, the SSO login and generic views"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "crispy-bootstrap5>=2026.9,<2026.10",
    "django>=6.1.2,<6.2",
    "django-crispy-forms>=2.7,<3",
    "django-filter>=26.2,<27",
    "django-tables2>=3.0.1,<4",
]

[project.urls]
Repository = "https://github.com/Cornelicorn/volucra-django-base"
Releases = "https://github.com/Cornelicorn/volucra-django-base/releases"

[project.optional-dependencies]
# Login with OpenID Connect, see volucra_base.auth_pipeline
sso = [
    "social-auth-app-django>=7.2.0,<9",
]

[dependency-groups]
dev = [
    "django-stubs[compatible-mypy]>=6.1.2,<6.2",
    "djhtml>=3.0.11,<4",
    "djlint>=1.54.0,<2",
    "mypy>=2.4.1,<2.5",
    "ruff>=0.17.6,<0.18",
    "social-auth-app-django>=7.2.0,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tabler_ui", "src/volucra_base"]

[tool.ruff]
lint.extend-select = ["I", "UP", "FURB", "DJ", "DTZ", "ARG", "ERA", "SIM", "RET", "PTH", "T20"]
line-length = 129
exclude = ["migrations"]

[tool.ruff.lint.flake8-bugbear]
# Lazy translations are immutable, so they can be defaults of arguments
extend-immutable-calls = ["django.utils.translation.gettext_lazy"]

[tool.ruff.lint.flake8-unused-arguments]
# Callbacks of Django and social-auth take *args or **kwargs they don't all need
ignore-variadic-names = true

[tool.mypy]
files = ["src", "tests"]
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true
mypy_path = "src"
strict_equality = true
warn_unreachable = true
warn_unused_ignores = true
disallow_incomplete_defs = true
enable_error_code = ["ignore-without-code", "possibly-undefined", "truthy-bool"]

[tool.django-stubs]
django_settings_module = "tests.settings"

[tool.djlint]
blank_line_before_tag="extends,block"
blank_line_after_tag="load,extends,endblock"
format_attribute_template_tags=true
format_css=true
format_js=true
# Ignore meta description and tags
ignore="H030,H031"
max_blank_lines=1
profile="django"
max_attribute_length=80
