[project]
name = "volucra-django-base"
version = "0.1.0"
description = "Reusable Django apps: tabler_ui for the Tabler based look and volucra_base for accounts, SSO and generic views"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "crispy-bootstrap5>=2024.10",
    "django>=5.1",
    "django-crispy-forms>=2.3",
    "django-filter>=25.1",
    "django-tables2>=2.7.5",
]

[project.optional-dependencies]
# Login with OpenID Connect, see volucra_base.auth_pipeline
sso = [
    "social-auth-app-django>=5.4.3",
]

[dependency-groups]
dev = [
    "django-stubs[compatible-mypy]>=5.1.3",
    "djhtml>=3.0.7",
    "djlint>=1.36.4",
    "mypy>=1.15.0",
    "ruff>=0.9.10",
    "social-auth-app-django>=5.4.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tabler_ui", "src/volucra_base"]

[tool.ruff]
lint.extend-select = ["I", "UP", "FURB"]
line-length = 129
exclude = ["migrations"]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true
mypy_path = "src"

[tool.django-stubs]
django_settings_module = "tests.settings"

[tool.djlint]
blank_line_before_tag="extends,block"
blank_line_after_tag="load,extends,endblock"
format_attribute_template_tags=true
format_css=true
format_js=true
# Ignore meta description and tags
ignore="H030,H031"
max_blank_lines=1
profile="django"
max_attribute_length=80
