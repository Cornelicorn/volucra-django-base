name: Publish

on:
  release:
    types:
      - published

permissions: {}

jobs:
  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/volucra-django-base/
    permissions:
      contents: read
      # Trusted Publishing, PyPI trusts the OIDC token of this workflow instead of an API token
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@v7

      # Publish the files the release workflow attached to the release, so PyPI gets exactly what was reviewed
      - name: Download the package from the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "*.whl" --pattern "*.tar.gz" --dir dist

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always dist/*
