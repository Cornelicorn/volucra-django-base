version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    # Raise an upper bound in pyproject.toml when a version beyond it comes out, versions within the bounds only
    # update uv.lock. The lower bounds stay, so projects using the package aren't forced to update.
    versioning-strategy: "increase-if-necessary"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
